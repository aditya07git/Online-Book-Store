<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
</head>
<body>
    
    <h1 style="background-color: rgb(10, 180, 232); color: white; height: 60px; display: flex; align-items: center;">
        <img src="Bookcart.png" alt="Cart Logo" style="width: 50px; height: 50px;">
        <p style="text-align: center; flex: 1;">Cart</p>
    </h1>
    <center>
        
        
        <table border="1" width="100%" cellpadding="10">
            <thead>
                <tr bgcolor="lightblue">
                    <th>Book Name</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Amount</th>
                </tr>
            </thead>
            <tr>
                <th>Introduction to Algorithms</th>
                <th>2</th>
                <th>₹999</th>
                <th>₹1998</th>
            </tr>
            <tr>
                <th>Clean Code</th>
                <th>1</th>
                <th>₹499</th>
                <th>₹499</th>
            </tr>
            <tr>
                <th colspan="3">Total Amount</th>
                <th>₹2497</th>
            </tr>
        </table>
    </center>
    <div class="button" align="center" style="margin-top: 20px;">
        <a href="catalogue.html" class="btn">
            <button style="background-color: lightblue; border: none; padding: 10px 20px; text-align: center; border-radius: 5px; cursor: pointer;">
                <- Continue Shopping
            </button>
        </a>

        <a href="checkout.html" class="btn">
            <button style="background-color: lightblue; border: none; padding: 10px 20px; text-align: center; border-radius: 5px; cursor: pointer;">
                Proceed to Checkout ->
            </button>
        </a>
    </div>

    <div class="footer">
        <p>&copy; 2026 Bookstore. Happy Reading!</p>
    </div>
</body>
</html>
