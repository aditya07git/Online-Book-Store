<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body background="reg.avif" style="background-size: cover; background-repeat: no-repeat;">
    <h1 style="text-align: center; background-color: aqua; height: 60px; display: flex; align-items: center; border-radius: 10px;">
        <p style="flex: 1;">Registration Form</p>
    </h1>
    <form action="submit_registration.php" method="post" cellpadding="10" style="width: 50%; margin: auto; border: 3px solid #0cadce; padding: 20px; border-radius: 10px;">
        <label for="Name">Name:</label>
        <input type="text" id="Name" name="Name" required><br><br>
        <label for="Email">Email:</label>
        <input type="email" id="Email" name="Email" required><br><br>
        <label for="Password">Password:</label>
        <input type="password" id="Password" name="Password" required><br><br>
        <label for="ConfirmPassword">Confirm Password:</label>
        <input type="password" id="ConfirmPassword" name="ConfirmPassword" required><br><br>
        <label for="Phone">Phone Number:</label>
        <input type="tel" id="Phone" name="Phone" pattern="[0-9]{10}" required><br><br>
        <label>Sex:</label>
        <input type="radio" id="Male" name="Sex" value="Male" required>
        <label for="Male">Male</label>
        <input type="radio" id="Female" name="Sex" value="Female" required>
        <label for="Female">Female</label>
        <input type="radio" id="Other" name="Sex" value="Other" required>
        <label for="Other">Other</label><br><br>
        <label for="DOB">Date of Birth:</label>
        <select id="day" name="day" required>
            <option value="">Day</option>
            <!-- Options for days 1-31 -->
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
            <option value="16">16</option>
            <option value="17">17</option>
            <option value="18">18</option>
            <option value="19">19</option>
            <option value="20">20</option>
            <option value="21">21</option>
            <option value="22">22</option>
            <option value="23">23</option>
            <option value="24">24</option>
            <option value="25">25</option>
            <option value="26">26</option>
            <option value="27">27</option>
            <option value="28">28</option>
            <option value="29">29</option>
            <option value="30">30</option>
            <option value="31">31</option>
        </select>
        <select id="month" name="month" required>
            <option value="">Month</option>
            <option value="1">January</option>
            <option value="2">February</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
        </select>
        <select id="year" name="year" required>
            <option value="">Year</option>
            <!-- Options for years 2000-2015 -->
            <option value="2000">2000</option>
            <option value="2001">2001</option>
            <option value="2002">2002</option>
            <option value="2003">2003</option>
            <option value="2004">2004</option>
            <option value="2005">2005</option>
            <option value="2006">2006</option>
            <option value="2007">2007</option>
            <option value="2008">2008</option>
            <option value="2009">2009</option>
            <option value="2010">2010</option>
            <option value="2011">2011</option>
            <option value="2012">2012</option>
            <option value="2013">2013</option>
            <option value="2014">2014</option>
            <option value="2015">2015</option>
        </select><br><br>
        <label>Languages Known:</label>
        <input type="checkbox" id="English" name="Languages[]" value="English">
        <label for="English">English</label>
        <input type="checkbox" id="Hindi" name="Languages[]" value="Hindi">
        <label for="Hindi">Hindi</label>
        <input type="checkbox" id="Telugu" name="Languages[]" value="Telugu">
        <label for="Telugu">Telugu</label>
        <input type="checkbox" id="Tamil" name="Languages[]" value="Tamil">
        <label for="Tamil">Tamil</label><br><br>

        <label for="Address">Address:</label><br>
        <textarea id="Address" name="Address" rows="4" cols="50" required></textarea><br><br>
        <input type="submit" value="Register" style="background-color:lightgreen; padding: 10px 20px; text-align: center; border-radius: 5px; cursor: pointer;">

    </form>
</body>
</html>
